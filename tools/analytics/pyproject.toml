[project]
name = "godxfeed-analytics"
version = "0.1.0"
description = "Periodic Bayesian-analytics publisher for godxfeed. Publishes posterior-density overlays on godxfeed.analytics.<type>.<symbol>. First cut: a dummy Gaussian publisher that exercises the frontend overlay contract end-to-end; PyMC / ibis plumbing comes later."
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "nats-py>=2.7",
  "numpy>=2.0",
  # Bayesian inference. PyMC → pytensor → numba → llvmlite: Intel Macs
  # lack x86_64 wheels for llvmlite ≥ 0.46, so pin the chain below that
  # threshold. See LEARNINGS.md entry "llvmlite / numba dropped macOS
  # x86_64 wheels". arm64 / Linux can safely use newer versions; pins
  # here are an upper bound that those platforms also satisfy.
  "pymc>=5.10",
  "numba<0.63",
  "llvmlite<0.46",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[project.scripts]
analytics-serve = "analytics.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analytics"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
