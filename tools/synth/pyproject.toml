[project]
name = "godxfeed-synth"
version = "0.1.0"
description = "Synthetic dxLink data source for godxfeed. Generates time series via PyMC prior-predictive sampling, persists to DuckDB, replays over a FastAPI WebSocket endpoint that impersonates the dxLink protocol."
requires-python = ">=3.11,<3.13"
dependencies = [
  "pymc>=5.10",
  "numpy>=1.26",
  "duckdb>=1.0",
  "ibis-framework[duckdb]>=9.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.0",
  # numba 0.63+ and llvmlite 0.46+ dropped macOS x86_64 wheels; pin to
  # the last versions that still ship prebuilt binaries for Intel Macs.
  # Drop these constraints when you're on Apple Silicon / Linux only.
  "numba<0.63",
  "llvmlite<0.46",
]

[project.scripts]
synth-generate = "synth.generate:main"
synth-serve = "synth.serve:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synth"]
