apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
data:
  nats-server.conf: |
    jetstream {
      store_dir: "/data"
    }
    http_port: 8222
    server_name: "nats-server"
    listen: 0.0.0.0:4222
    authorization {
      users = [
        {
          user: ${NATS_AUTH_USER}
          password: ${NATS_AUTH_PASSWORD}
        },
        {
          user: ${NATS_GODXFEED_USER}
          password: ${NATS_GODXFEED_PASSWORD}
        }
      ]
    }