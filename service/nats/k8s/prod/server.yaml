apiVersion: v1
kind: Service
metadata:
  name: nats-server
spec:
  type: ClusterIP
  ports:
  - port: 4222
    targetPort: 4222
    name: client
  - port: 8222
    targetPort: 8222
    name: monitoring
  - port: 6222
    targetPort: 6222
    name: cluster
  selector:
    app: nats-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nats-server
  template:
    metadata:
      labels:
        app: nats-server
    spec:
      containers:
      - name: nats
        image: nats:2.10-alpine
        ports:
        - containerPort: 4222
          name: client
        - containerPort: 8222
          name: monitoring
        - containerPort: 6222
          name: cluster
        volumeMounts:
        - name: nats-config
          mountPath: /etc/nats
        - name: nats-data
          mountPath: /data
      volumes:
      - name: nats-config
        configMap:
          name: nats-config
      - name: nats-data
        persistentVolumeClaim:
          claimName: nats-data-pvc